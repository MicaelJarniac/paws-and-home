<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to Paws & Home — a pet adoption shelter connecting loving families with animals in need.">
  <title>Log In — Paws &amp; Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <main id="main-content" class="login-wrapper">
    <div class="login-card">
      <h1 class="login-logo" aria-label="Paws and Home">🐾 Paws <span>&amp;</span> Home</h1>
      <p class="login-subtitle">Shelter volunteer portal</p>

      <!-- Live region: announced by screen readers when content changes -->
      <div id="login-feedback" class="form-feedback" role="alert" aria-live="assertive"></div>

      <form id="login-form" action="#" method="post" aria-label="Login form" novalidate>
        <fieldset>
          <legend class="visually-hidden">Enter your credentials</legend>

          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
              aria-required="true"
              aria-describedby="username-error"
            >
            <span id="username-error" class="field-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="password-error"
            >
            <span id="password-error" class="field-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Log In</button>
        </fieldset>
      </form>

      <p class="login-hint">
        <small>Hint: <strong>admin</strong> / <strong>admin</strong></small>
      </p>
    </div>
  </main>

  <!-- Theme toggle on login page too -->
  <button
    class="theme-toggle"
    id="theme-toggle"
    type="button"
    aria-label="Toggle dark mode"
    title="Toggle dark mode"
  >🌙</button>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
